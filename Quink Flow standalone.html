document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px 96px;text-align:center\">\n    <div style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#8A8377;margin-bottom:26px\">\n      <span style=\"width:5px;height:5px;border-radius:50%;background:#2F7D57\"><\u002Fspan>\n      For the support &amp; ops teams who write the docs\n    <\u002Fdiv>\n    <h1 style=\"font-size:60px;font-weight:600;letter-spacing:-.03em;line-height:1.04;margin:0 0 24px;text-wrap:balance\">The week of article-writing<br>you never have to do.<\u002Fh1>\n    <p style=\"font-size:20px;color:#5C574E;max-width:600px;margin:0 auto 40px;text-wrap:pretty\">Record your screen once. Quink turns it into a polished, step-by-step help article — published straight to your own branded help center at docs.yourcompany.com.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px\">\n      <button sc-camel-on-click=\"{{ goUpload }}\" style=\"background:#0E5C6B;color:#fff;border:0;padding:15px 30px;border-radius:10px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(33,31,27,.10)\" style-hover=\"background:#0B4A57\">Build my article<\u002Fbutton>\n      <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#8A8377\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2F7D57\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n        Free to try — 3 free articles, no card needed\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3-STEP STORY -->\n  <section style=\"max-width:1040px;margin:0 auto;padding:8px 32px 100px\">\n    <div style=\"text-align:center;margin-bottom:44px\">\n      <p style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#196C7C;margin:0 0 8px\">How it works<\u002Fp>\n      <h2 style=\"font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0\">Three steps. About ninety seconds.<\u002Fh2>\n    <\u002Fdiv>\n    <!-- seam -->\n    <div style=\"display:flex;align-items:center;gap:0;height:14px;margin:0 auto 30px;max-width:900px;padding:0 60px\">\n      <span style=\"flex:1;height:1px;background:#D8D2C7\"><\u002Fspan>\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#0E5C6B;box-shadow:0 0 0 4px #EAF3F4;margin:0 4px\"><\u002Fspan>\n      <span style=\"flex:1;height:1px;background:#D8D2C7\"><\u002Fspan>\n      <span style=\"width:1px;height:6px;background:#D8D2C7\"><\u002Fspan>\n      <span style=\"flex:1;height:1px;background:#D8D2C7\"><\u002Fspan>\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#0E5C6B;box-shadow:0 0 0 4px #EAF3F4;margin:0 4px\"><\u002Fspan>\n      <span style=\"flex:1;height:1px;background:#D8D2C7\"><\u002Fspan>\n      <span style=\"width:1px;height:6px;background:#D8D2C7\"><\u002Fspan>\n      <span style=\"flex:1;height:1px;background:#D8D2C7\"><\u002Fspan>\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#0E5C6B;box-shadow:0 0 0 4px #EAF3F4;margin:0 4px\"><\u002Fspan>\n      <span style=\"flex:1;height:1px;background:#D8D2C7\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n      <div style=\"background:#fff;border:1px solid #E6E1D9;border-radius:16px;padding:28px;box-shadow:0 1px 2px rgba(33,31,27,.06)\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:#EAF3F4;color:#0B4A57;font-size:12px;font-weight:600;margin-bottom:16px\">1<\u002Fspan>\n        <h3 style=\"font-size:18px;font-weight:600;margin:0 0 6px\">Record your screen<\u002Fh3>\n        <p style=\"font-size:14px;color:#5C574E;margin:0 0 18px\">Do the workflow you already know cold — .mp4 or .mov, no narration required.<\u002Fp>\n        <div style=\"height:88px;border-radius:8px;background:#211F1B;position:relative;ove =\"display:inline-flex;align-items:center;gap:1px;font-weight:600;color:#5C574E;font-family:'Hanken Grotesk',sans-serif\">Qu<svg width=\"7\" height=\"15\" sc-camel-view-box=\"0 0 11 23\" style=\"align-self:center\"><circle cx=\"5.5\" cy=\"4\" r=\"2.7\" fill=\"#2F7D57\"><\u002Fcircle><path d=\"M6.6 8 L2.6 14 H5 L4 19.5 L8.6 12.2 H6 L7 8 Z\" fill=\"#0E5C6B\"><\u002Fpath><\u002Fsvg>nk<\u002Fspan><\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ PUBLISH ============ -->\n<sc-if value=\"{{ isPublish }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;background:#F2EFEA;display:flex;align-items:center;justify-content:center;padding:40px 24px\">\n  <div style=\"width:100%;max-width:460px;background:#fff;border:1px solid #E6E1D9;border-radius:18px;box-shadow:0 12px 40px rgba(33,31,27,.12);padding:38px 36px;animation:qrise .35s ease both;text-align:center\">\n    <sc-if value=\"{{ notPublished }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"display:inline-flex;width:54px;height:54px;border-radius:14px;background:#EAF3F4;align-items:center;justify-content:center;margin-bottom:20px\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E5C6B\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v13\"><\u002Fpath><path d=\"m8 12 4 4 4-4\"><\u002Fpath><path d=\"M20 21H4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <h2 style=\"font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px\">Publish this article?<\u002Fh2>\n      <p style=\"font-size:15px;color:#5C574E;margin:0 0 22px;text-wrap:pretty\">It goes live on your help center immediately. You can edit or unpublish it any time.<\u002Fp>\n      <div style=\"text-align:left;margin-bottom:20px\">\n        <div style=\"font-size:13px;font-weight:600;color:#211F1B;margin-bottom:10px\">Choose a category for this article<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wra lse }}\">\n      <span style=\"display:inline-flex;width:58px;height:58px;border-radius:50%;background:#2F7D57;align-items:center;justify-content:center;margin-bottom:20px\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <h2 style=\"font-size:23px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px\">You're live!<\u002Fh2>\n      <p style=\"font-size:15px;color:#5C574E;margin:0 0 22px;text-wrap:pretty\">Your article is now live under {{ articleCatName }} and searchable on your help center.<\u002Fp>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;color:#0B4A57;background:#EAF3F4;border:1px solid #CFE4E7;border-radius:10px;padding:12px;margin-bottom:24px;font-family:ui-monospace,Menlo,monospace\">{{ hcUrl }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goHelpcenter }}\" style=\"width:100%;background:#0E5C6B;color:#fff;border:0;padding:14px;border-radius:10px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:14px\" style-hover=\"background:#0B4A57\">View your live help center<\u002Fbutton>\n      <a href=\"#\" sc-camel-on-click=\"{{ backToHub }}\" style=\"font-size:14px;color:#8A8377\">Back to editor<\u002Fa>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startCurrency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;INR&quot;,&quot;USD&quot;],&quot;default&quot;:&quot;INR&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;defaultAnnual&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;demoCompany&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Meridian&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;readerAccent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#6D28D9&quot;,&quot;#B45309&quot;,&quot;#166534&quot;,&quot;#0E5C6B&quot;],&quot;default&quot;:&quot;#6D28D9&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'landing',\n    annual: (this.props && this.props.defaultAnnual !== undefined) ? this.props.defaultAnnual : true,\n    currency: (this.props && this.props.startCurrency) || 'INR',\n    productName: '',\n    fileName: null,\n    dragOver: false,\n    stage: 0,\n    folders: null,\n    articles: null,\n    editingId: null,\n    editingStep: null,\n    brandDismissed: false,\n    libQuery: '',\n    renamingId: null,\n    renameDraft: '',\n    pendingDelete: null,\n    // help center\n    brandColor: '#0E5C6B',\n    hcName: (this.props && this.props.demoCompany) || 'Meridian',\n    logoInitial: ((((this.props && this.props.demoCompany) || 'M')[0]) || 'M').toUpperCase(),\n    hcHeadline: 'How can we help?',\n    hcTagline: 'Guides, tutorials, and answers for getting the most out of your workspace.',\n    searchPlaceholder: 'Search for articles…',\n    fontKey: 'grotesk',\n    hcQuery: '',\n    activeArticle: null,\n    feedback: null,\n    published: false,\n  };\n\n  timers = [];\n\n  ssoSteps() {\n    const titles = ['Open Settings and choose Security', 'Turn on Single Sign-On', 'Paste your provider metadata', 'Invite your team to sign in'];\n    const bodies = [\n      'From the left sidebar, open Settings, then select the Security tab.',\n      'Under Authentication, toggle Single Sign-On to enabled.',\n      'Copy the metadata URL from your identity provider and paste it into the SAML field, then save.',\n      'Send the new sign-in link to your team so everyone signs in with one account.',\n    ];\n    return titles.map((t, i) => ({ title: t, body: bodies[i] }));\n  }\n\n  buildSeed() {\n    const folders = [], articles = [];\n    (this.categories || []).forEach((c, i) => {\n      const fid = 'f-' + i;\n      folders.push({ id: fid, name: c.name, desc: c.desc, icon: c.icon });\n      c.articles.forEach(a => articles.push({\n        id: a.id, folderId: fid, title: a.title, snippet: a.snippet,\n        updated: a.updated, minutes: a.minutes, intro: a.intro,\n        steps: a.steps.map(st => ({ title: st.title, body: st.body })), status: 'published',\n      }));\n    });\n    return { folders, articles };\n  }\n\n  componentDidMount() {\n    if (!this.state.folders) { const seed = this.buildSeed(); this.setState({ folders: seed.folders, articles: seed.articles }); }\n  }\n\n  updArticle = (id, patch) => this.setState(st => ({ articles: (st.articles || []).map(a => a.id === id ? Object.assign({}, a, patch) : a) }));\n\n  createDraft = () => {\n    const id = 'draft-' + Date.now();\n    const title = (this.state.productName || '').trim() || 'Setting up single sign-on (SSO)';\n    const steps = this.ssoSteps();\n    const art = {\n      id, folderId: null, title,\n      snippet: 'A step-by-step guide drafted automatically from your recording.',\n      updated: 'Draft · just now', minutes: steps.length + ' steps',\n      intro: 'This guide was drafted automatically from your screen recording. Review each step, fix any screenshot, then choose a folder and publish.',\n      steps, status: 'draft',\n    };\n    this.setState(st => ({ articles: (st.articles || []).concat([art]), editingId: id, editingStep: null, published: false }));\n  };\n\n  goArticle = (id) => { this.setState({ activeArticle: id, feedback: null }); this.go('article'); };\n\n  categories = [\n    { name: 'Getting started', desc: 'New to Quink? Start here.', icon: 'M12 2 2 7l10 5 10-5-10-5Z M2 17l10 5 10-5 M2 12l10 5 10-5', articles: [\n      { id: 'create-account', title: 'Creating your Quink account', snippet: 'Set up your workspace and invite your team in under two minutes.', updated: 'Updated 3 days ago', minutes: '2 min read',\n        intro: 'Your Quink account is where your recordings, draft articles, and published help center all live. Here is how to create one and get your workspace ready.',\n        steps: [\n          { title: 'Sign up with Google or email', body: 'On the Quink homepage, choose Continue with Google, or enter your work email to get a one-tap sign-in link. No credit card is needed to start.' },\n          { title: 'Name your workspace', body: 'Pick a workspace name — usually your company name. This becomes the default title of your help center, which you can change any time.' },\n          { title: 'Invite your team', body: 'Open Settings then Members and add teammates by email. Every seat is included in your plan, so invite everyone who writes docs.' },\n        ] },\n      { id: 'first-recording', title: 'Recording your first workflow', snippet: 'Record a workflow once and let Quink draft the whole article.', updated: 'Updated 1 week ago', minutes: '3 min read',\n        intro: 'The fastest way to see what Quink does is to record a real workflow. Quink watches the recording and drafts a step-by-step article, one screenshot per action.',\n        steps: [\n          { title: 'Start a screen recording', body: 'Use any recorder you like — QuickTime, Loom, or your built-in screen capture. Record yourself doing the workflow at a normal pace; no narration required.' },\n          { title: 'Upload the file to Quink', body: 'Drag your .mp4 or .mov onto the upload screen, add a feature name, and choose an audience and tone. Then select Build my article.' },\n          { title: 'Review the draft', body: 'In about 90 seconds you get a full draft with headings, steps, and screenshots. Fix any frame or reword a line, then publish.' },\n        ] },\n      { id: 'editor-tour', title: 'A tour of the article editor', snippet: 'Understand the panels, steps, and screenshot tools in the editor.', updated: 'Updated 2 weeks ago', minutes: '2 min read',\n        intro: 'The article editor is where you polish Quink\\u2019s draft before publishing. Everything is click-to-edit, so you repair rather than write from scratch.',\n        steps: [\n          { title: 'Edit any step inline', body: 'Click a step\\u2019s text to edit it directly. Titles and body copy save automatically when you click away.' },\n          { title: 'Fix a screenshot', body: 'Each step has a captured frame. If Quink grabbed the wrong moment, choose Wrong frame to pick a better one from the recording.' },\n          { title: 'Publish when ready', body: 'When the article looks right, select Publish to send it live to your hosted help center.' },\n        ] },\n    ] },\n    { name: 'Recording & uploading', desc: 'Get the cleanest source for your articles.', icon: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z', articles: [\n      { id: 'formats', title: 'Supported file formats and limits', snippet: 'Which video formats Quink accepts and the maximum file size.', updated: 'Updated 5 days ago', minutes: '1 min read',\n        intro: 'Quink works with standard screen-recording formats. Here is what is supported and the current limits.',\n        steps: [\n          { title: 'Accepted formats', body: 'Upload .mp4 or .mov files. Most screen recorders export one of these by default.' },\n          { title: 'File size limit', body: 'Files can be up to 500 MB. For long workflows, trim the recording to just the steps you want documented.' },\n          { title: 'Resolution tips', body: 'Record at 1080p or higher so the captured screenshots stay crisp in the published article.' },\n        ] },\n      { id: 'best-practices', title: 'Recording tips for the cleanest article', snippet: 'Small habits while recording that produce a much cleaner article.', updated: 'Updated 4 days ago', minutes: '2 min read',\n        intro: 'Quink drafts better articles when the recording is clear. A few simple habits make a big difference.',\n        steps: [\n          { title: 'Move at a steady pace', body: 'Pause briefly on each screen before clicking. This helps Quink capture a clean screenshot for every step.' },\n          { title: 'Close distractions', body: 'Hide unrelated tabs, notifications, and personal info before recording so nothing sensitive ends up in a screenshot.' },\n          { title: 'One workflow per recording', body: 'Record a single task from start to finish. Shorter, focused recordings become tighter, more useful articles.' },\n        ] },\n      { id: 'rerecord', title: 'Re-recording or replacing a step', snippet: 'Replace a single step\\u2019s footage without redoing the whole thing.', updated: 'Updated 1 week ago', minutes: '2 min read',\n        intro: 'If one step did not record well, you do not have to start over. You can re-record just that part.',\n        steps: [\n          { title: 'Open the step', body: 'In the editor, find the step with the bad footage and select Wrong frame.' },\n          { title: 'Upload a short clip', body: 'Record just that action again and drop the new clip in. Quink re-captures the screenshot from it.' },\n          { title: 'Confirm the replacement', body: 'Review the new screenshot and save. The rest of your article stays untouched.' },\n        ] },\n    ] },\n    { name: 'Editing your articles', desc: 'Polish the draft into something you are proud to link.', icon: 'M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z', articles: [\n      { id: 'swap-screenshot', title: 'Swapping a screenshot', snippet: 'Pick a better frame or upload your own image for any step.', updated: 'Updated 6 days ago', minutes: '1 min read',\n        intro: 'Every step shows one screenshot. If it is not the clearest moment, swapping it takes seconds.',\n        steps: [\n          { title: 'Select Wrong frame', body: 'Hover the screenshot and choose Wrong frame to open the frame picker.' },\n          { title: 'Scrub to a better moment', body: 'Drag along the recording timeline to find the clearest frame, then select it.' },\n          { title: 'Or upload your own', body: 'Prefer a custom image? Upload a PNG or JPG to use instead of a captured frame.' },\n        ] },\n      { id: 'edit-text', title: 'Editing step text and headings', snippet: 'Reword headings and step instructions to match your voice.', updated: 'Updated 3 days ago', minutes: '2 min read',\n        intro: 'Quink\\u2019s draft is a starting point. Editing the wording keeps the article on-brand and accurate.',\n        steps: [\n          { title: 'Click to edit', body: 'Click any heading or paragraph to edit it inline. Changes save automatically.' },\n          { title: 'Keep steps action-first', body: 'Start each step with the action — Open Settings, Select Save — so readers can scan quickly.' },\n          { title: 'Match your tone', body: 'Adjust wording to the audience and tone you chose at upload. You can always regenerate a step\\u2019s draft too.' },\n        ] },\n      { id: 'reorder', title: 'Reordering and deleting steps', snippet: 'Rearrange or remove steps to get the flow just right.', updated: 'Updated 1 week ago', minutes: '2 min read',\n        intro: 'Sometimes the recording captured steps out of order, or an extra click you do not need. Reordering fixes that.',\n        steps: [\n          { title: 'Drag to reorder', body: 'Grab a step by its number and drag it up or down. Step numbers renumber automatically.' },\n          { title: 'Delete a step', body: 'Select the step menu and choose Delete to remove an unnecessary action.' },\n          { title: 'Merge related actions', body: 'Combine two tiny steps into one when they are part of the same action, keeping the article concise.' },\n        ] },\n    ] },\n    { name: 'Your help center', desc: 'Make the reader experience your own.', icon: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10', articles: [\n      { id: 'theming', title: 'Customizing your help center theme', snippet: 'Set your logo, brand color, fonts, and welcome message.', updated: 'Updated 2 days ago', minutes: '2 min read',\n        intro: 'Your help center should look like your product. Quink keeps theming simple and impossible to make ugly.',\n        steps: [\n          { title: 'Open Theming', body: 'From your workspace, go to Your help center then Theming.' },\n          { title: 'Set brand and type', body: 'Choose your brand color, upload a logo, and pick a font. The live preview updates as you change each option.' },\n          { title: 'Write your welcome', body: 'Add a headline and short description for the help center home so visitors know they are in the right place.' },\n        ] },\n      { id: 'domain', title: 'Connecting your custom domain', snippet: 'Publish your help center to docs.yourcompany.com.', updated: 'Updated 5 days ago', minutes: '3 min read',\n        intro: 'By default your help center lives on a Quink subdomain. Connecting your own domain makes it feel fully yours.',\n        steps: [\n          { title: 'Add your domain', body: 'Go to Your help center then Domain and enter the subdomain you want, like docs.yourcompany.com.' },\n          { title: 'Update your DNS', body: 'Add the CNAME record Quink shows you at your domain provider. This points the subdomain at your help center.' },\n          { title: 'Verify and go live', body: 'Select Verify. Once DNS propagates, your help center is live on your own domain with HTTPS handled for you.' },\n        ] },\n      { id: 'organize', title: 'Organizing articles into categories', snippet: 'Group articles into categories readers can browse.', updated: 'Updated 1 week ago', minutes: '2 min read',\n        intro: 'Categories give your help center structure so visitors can find answers by topic, not just by search.',\n        steps: [\n          { title: 'Create a category', body: 'In Your help center then Content, select New category and give it a clear name like Getting started.' },\n          { title: 'Assign articles', body: 'Open an article and choose its category, or drag articles between categories in the content list.' },\n          { title: 'Order for scanning', body: 'Arrange categories with the most common topics first — that is what visitors reach for.' },\n        ] },\n    ] },\n  ];\n\n  componentWillUnmount() { this.timers.forEach(clearTimeout); }\n\n  go = (screen) => {\n    this.timers.forEach(clearTimeout); this.timers = [];\n    if (typeof window !== 'undefined') window.scrollTo(0, 0);\n    if (screen === 'generating') {\n      this.setState({ screen, stage: 0 });\n      this.runGen();\n    } else {\n      this.setState({ screen });\n    }\n  };\n\n  runGen = () => {\n    const step = () => {\n      this.setState(s => {\n        const next = s.stage + 1;\n        if (next >= 4) {\n          this.timers.push(setTimeout(() => { this.createDraft(); this.go('hub'); }, 900));\n          return { stage: 4 };\n        }\n        this.timers.push(setTimeout(step, 1900));\n        return { stage: next };\n      });\n    };\n    this.timers.push(setTimeout(step, 1900));\n  };\n\n  onDrop = (e) => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) this.setState({ fileName: f.name, dragOver: false }); };\n  onDragOver = (e) => { e.preventDefault(); if (!this.state.dragOver) this.setState({ dragOver: true }); };\n  onFilePick = (e) => { const f = e.target.files && e.target.files[0]; if (f) this.setState({ fileName: f.name }); };\n  onProductName = (e) => this.setState({ productName: e.target.value });\n\n  buildFromUpload = () => {\n    if (!this.state.productName.trim()) return;\n    if (!this.state.fileName) this.setState({ fileName: 'screen-recording.mov' });\n    this.go('wall');\n  };\n\n  fmt(cur, n) {\n    if (cur === 'INR') return '₹' + n.toLocaleString('en-IN');\n    return '$' + n.toLocaleString('en-US');\n  }\n\n  renderVals() {\n    const s = this.state;\n    const co = (this.props && this.props.demoCompany) || 'Meridian';\n    const accent = (this.props && this.props.readerAccent) || '#6D28D9';\n\n    const folders = s.folders || [];\n    const articles = s.articles || [];\n    const folderById = {};\n    folders.forEach(f => { folderById[f.id] = f; });\n\n    const fontMap = { grotesk: \"'Hanken Grotesk',sans-serif\", serif: \"'Lora',Georgia,serif\", rounded: \"'Poppins',sans-serif\" };\n    const tFont = fontMap[s.fontKey] || fontMap.grotesk;\n    const hcUrl = 'docs.' + ((s.hcName || 'meridian').toLowerCase().replace(/[^a-z0-9]/g, '') || 'meridian') + '.com';\n\n    const swatchColors = ['#0E5C6B', '#4F46E5', '#0F766E', '#B91C1C', '#B45309', '#334155'];\n    const swatches = swatchColors.map(c => ({\n      pick: () => this.setState({ brandColor: c }),\n      style: 'width:32px;height:32px;border-radius:8px;padding:0;cursor:pointer;background:' + c +\n        ';border:1px solid rgba(0,0,0,.08);outline:' + (s.brandColor === c ? '2.5px solid #211F1B' : '2.5px solid transparent') + ';outline-offset:2px',\n    }));\n    const fontDefs = [{ key: 'grotesk', label: 'Grotesk' }, { key: 'serif', label: 'Serif' }, { key: 'rounded', label: 'Rounded' }];\n    const fontOpts = fontDefs.map(f => ({\n      label: f.label,\n      pick: () => this.setState({ fontKey: f.key }),\n      style: 'flex:1;padding:10px 8px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;font-family:' + fontMap[f.key] +\n        ';' + (s.fontKey === f.key ? 'background:#0E5C6B;color:#fff;border:1px solid #0E5C6B' : 'background:#fff;color:#5C574E;border:1px solid #D8D2C7'),\n    }));\n\n    const pill = (sel) => 'padding:8px 14px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;' +\n      (sel ? 'background:#0E5C6B;color:#fff;border:1px solid #0E5C6B' : 'background:#fff;color:#5C574E;border:1px solid #D8D2C7');\n\n    // ---- editing article: the editor works on
