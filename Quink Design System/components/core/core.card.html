<!-- @dsCard group="Components" viewport="900x420" name="Core — buttons, icon buttons, segmented, switch, chips, icons" subtitle="No borders. Hover deepens the fill and lifts one elevation step; press settles 1.5%." -->
<meta charset="utf-8">
<title>Quink — core</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg);padding:24px 26px}.stack{display:flex;flex-direction:column;gap:26px}.set{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tr-mono);text-transform:uppercase;color:var(--ink-4);margin-bottom:12px}</style>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Segmented, Switch, Chip, Icon, ICON_NAMES } = window.QuinkDesignSystem_6ae0bd
function Demo(){
  const [mode,setMode]=React.useState('Edit'); const [on,setOn]=React.useState(true); const [f,setF]=React.useState('All')
  return <div className="stack">
    <div><p className="cap">Button — primary · accent · secondary · ghost · critical</p>
      <div className="set">
        <Button size="lg">Build my guide</Button>
        <Button>Publish</Button>
        <Button variant="accent" icon="check">Publish changes</Button>
        <Button variant="secondary" icon="folder-plus">New folder</Button>
        <Button variant="ghost" icon="arrow-left">Help center</Button>
        <Button variant="critical" size="sm">Delete</Button>
        <Button disabled>Publish</Button>
      </div></div>
    <div><p className="cap">Icon button · segmented · switch</p>
      <div className="set">
        <IconButton icon="undo" label="Undo" /><IconButton icon="redo" label="Redo" disabled />
        <IconButton icon="image" label="Swap frame" raised />
        <IconButton icon="trash" label="Delete" tone="critical" />
        <Segmented options={['Edit','Preview']} value={mode} onChange={setMode} />
        <Switch checked={on} onChange={setOn} label="Listed" />
      </div></div>
    <div><p className="cap">Chips — the one surviving pill, because it is a control</p>
      <div className="set" style={{gap:2}}>
        {['All','Live','Drafts'].map((k,i)=><Chip key={k} on={f===k} count={[45,2,42][i]} onClick={()=>setF(k)}>{k}</Chip>)}
      </div></div>
    <div><p className="cap">Icon set — Lucide at stroke 1.75, always currentColor</p>
      <div className="set" style={{gap:16,color:'var(--ink-2)'}}>{ICON_NAMES.map(n=><Icon key={n} name={n} size={18} />)}</div></div>
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>)
</script>
