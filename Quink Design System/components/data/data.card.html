<div id="root"></div>
<script type="text/babel">
const { Card, State, Row, Group, Thumb, Progress, AvatarStack, Micro, Button, IconButton } = window.QuinkDesignSystem_6ae0bd
function Demo(){

        <Progress value={0.5} style={{width:180}} />
      </div></div>
    <div><p className="cap">Group + rows — a heading on the page, one raised surface for the rows</p>
      <Group name="Getting started" count="3 articles" actions={<><IconButton icon="pencil" label="Rename" size="sm" /><IconButton icon="dots" label="More" size="sm" /></>}>

    </div>
    <div><p className="cap">Card · inset · panel</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
        <Card pad><h4 style={{marginBottom:6}}>Raised</h4><p style={{fontSize:14,color:'var(--ink-3)'}}>surface-1 + e1</p></Card>
        <Card variant="inset" pad><h4 style={{marginBottom:6}}>Inset</h4><p style={{fontSize:14,color:'var(--ink-3)'}}>surface-2, no shadow</p></Card>
