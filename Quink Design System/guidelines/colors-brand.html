<meta charset="utf-8"><title>Brand</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg);padding:22px 24px}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tr-mono);text-transform:uppercase;color:var(--ink-4)}.sw{border-radius:var(--r-md);height:56px;display:flex;align-items:flex-end;padding:8px 9px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em}.grid{display:grid;gap:8px}.row{display:flex;align-items:baseline;gap:18px;margin-bottom:12px}.row .cap{width:92px;flex:none;text-align:right}</style>
<div class="grid" style="grid-template-columns:repeat(10,1fr)">
<div><div class="sw" style="background:var(--brand-50);color:var(--brand-900)">50</div></div><div><div class="sw" style="background:var(--brand-100);color:var(--brand-900)">100</div></div><div><div class="sw" style="background:var(--brand-200);color:var(--brand-900)">200</div></div><div><div class="sw" style="background:var(--brand-300);color:var(--brand-900)">300</div></div><div><div class="sw" style="background:var(--brand-400);color:var(--on-brand)">400</div></div><div><div class="sw" style="background:var(--brand-500);color:var(--on-brand)">500</div></div><div><div class="sw" style="background:var(--brand-600);color:var(--on-brand)">600</div></div><div><div class="sw" style="background:var(--brand-700);color:var(--on-brand)">700</div></div><div><div class="sw" style="background:var(--brand-800);color:var(--on-brand)">800</div></div><div><div class="sw" style="background:var(--brand-900);color:var(--on-brand)">900</div></div>
</div>
<p class="cap" style="margin-top:14px">--brand-600 is the hero. in dark mode the ramp inverts: 600 lifts, tints go darker.</p>
