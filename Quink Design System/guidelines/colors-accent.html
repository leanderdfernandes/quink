<meta charset="utf-8"><title>Accent</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg);padding:22px 24px}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tr-mono);text-transform:uppercase;color:var(--ink-4)}.sw{border-radius:var(--r-md);height:56px;display:flex;align-items:flex-end;padding:8px 9px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em}.grid{display:grid;gap:8px}.row{display:flex;align-items:baseline;gap:18px;margin-bottom:12px}.row .cap{width:92px;flex:none;text-align:right}</style>
<div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div><div class="sw" style="background:var(--accent-50);color:var(--accent-700)">50</div></div><div><div class="sw" style="background:var(--accent-100);color:var(--accent-700)">100</div></div><div><div class="sw" style="background:var(--accent-300);color:var(--accent-700)">300</div></div><div><div class="sw" style="background:var(--accent-500);color:var(--on-accent)">500</div></div><div><div class="sw" style="background:var(--accent-600);color:var(--on-accent)">600</div></div><div><div class="sw" style="background:var(--accent-700);color:var(--on-accent)">700</div></div>
</div>
<p class="cap" style="margin-top:14px">one accent button per screen, and only for completion. a second one destroys the signal.</p>
