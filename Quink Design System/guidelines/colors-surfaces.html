<meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg);padding:22px 24px}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tr-mono);text-transform:uppercase;color:var(--ink-4)}.sw{border-radius:var(--r-md);height:56px;display:flex;align-items:flex-end;padding:8px 9px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em}.grid{display:grid;gap:8px}.row{display:flex;align-items:baseline;gap:18px;margin-bottom:12px}.row .cap{width:92px;flex:none;text-align:right}</style>
<div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="background:var(--bg);color:var(--ink-3);box-shadow:var(--e1),var(--edge)">--bg</div></div><div><div class="sw" style="background:var(--surface-1);color:var(--ink-3);box-shadow:var(--e1),var(--edge)">--surface-1</div></div><div><div class="sw" style="background:var(--surface-2);color:var(--ink-3);box-shadow:var(--e1),var(--edge)">--surface-2</div></div><div><div class="sw" style="background:var(--surface-3);color:var(--ink-3);box-shadow:var(--e1),var(--edge)">--surface-3</div></div><div><div class="sw" style="background:var(--surface-4);color:var(--ink-3);box-shadow:var(--e1),var(--edge)">--surface-4</div></div>
</div>
<p class="cap" style="margin-top:14px">page → raised → inset → hover → pressed. a card is surface-1 on bg; a well inside it is surface-2.</p>
