<meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg);padding:22px 24px}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tr-mono);text-transform:uppercase;color:var(--ink-4)}.sw{border-radius:var(--r-md);height:56px;display:flex;align-items:flex-end;padding:8px 9px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em}.grid{display:grid;gap:8px}.row{display:flex;align-items:baseline;gap:18px;margin-bottom:12px}.row .cap{width:92px;flex:none;text-align:right}.e{background:var(--surface-1);border-radius:var(--r-lg);height:86px;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}</style>

</div>
