<!-- @dsCard group="Colors" viewport="900x240" name="Dark theme" subtitle="Warm near-black, never blue-black. Depth switches from shadow to surface lightness plus a 1px inner light." -->
<meta charset="utf-8"><title>Dark</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg);padding:22px 24px}.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tr-mono);text-transform:uppercase;color:var(--ink-4)}.sw{border-radius:var(--r-md);height:56px;display:flex;align-items:flex-end;padding:8px 9px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em}.grid{display:grid;gap:8px}.row{display:flex;align-items:baseline;gap:18px;margin-bottom:12px}.row .cap{width:92px;flex:none;text-align:right}body{padding:0}</style>
<div style="display:grid;grid-template-columns:1fr 1fr">
<div style="padding:24px;background:var(--bg)">
  <p class="cap" style="margin-bottom:14px">light</p>
  <div style="background:var(--surface-1);border-radius:var(--r-lg);box-shadow:var(--e1),var(--edge);padding:18px">
    <h4 style="font-size:21px;margin-bottom:7px">Run your first sync</h4>
    <p style="font-size:14.5px;color:var(--ink-3);margin-bottom:14px">Pick tables, set a schedule.</p>
    <button class="q-btn q-btn--sm">Publish</button>
  </div>
</div>
<div data-theme="dark" style="padding:24px;background:var(--bg)">
  <p class="cap" style="margin-bottom:14px">dark</p>
  <div style="background:var(--surface-1);border-radius:var(--r-lg);box-shadow:var(--e1),var(--edge);padding:18px">
    <h4 style="font-size:21px;margin-bottom:7px;color:var(--ink)">Run your first sync</h4>
    <p style="font-size:14.5px;color:var(--ink-3);margin-bottom:14px">Pick tables, set a schedule.</p>
    <button class="q-btn q-btn--sm">Publish</button>
  </div>
</div>
</div>
