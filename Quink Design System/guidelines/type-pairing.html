<h2 style="font-size:38px;letter-spacing:-.03em;max-width:22ch;margin-bottom:14px">Connect a Postgres read replica</h2>
<p class="q-lede" style="margin-bottom:18px">A replica keeps Northwind off your production traffic. This takes about five minutes and one grant.</p>
<p class="q-prose" style="font-size:17px">Use the replica endpoint, not the primary. On managed Postgres this usually ends in <code>-ro</code> or <code>-replica</code>.</p>
