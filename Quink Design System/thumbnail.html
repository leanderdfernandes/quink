<meta charset="utf-8">
<title>Quink</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 300px}.main{background:oklch(44% 0.088 205);display:grid;place-items:center}.strip{display:grid;grid-template-rows:repeat(3,1fr)}</style>
<div class="tile">
  <div class="main"><img src="assets/quink-wordmark-light.svg" alt="Quink" style="width:64%;display:block"></div>
  <div class="strip">
    <div style="background:oklch(63.5% 0.095 205)"></div>
    <div style="background:oklch(48% 0.098 158)"></div>
    <div style="background:oklch(30% 0.062 205)"></div>
  </div>
</div>
