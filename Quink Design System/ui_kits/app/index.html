<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quink — authoring app</title>
<link rel="icon" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>
  // Restore the theme before first paint so a dark-mode user never sees a light flash.
  try {
    var t = localStorage.getItem('quink-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="Upload.jsx"></script>
<script type="text/babel" src="Library.jsx"></script>
<script type="text/babel" src="Editor.jsx"></script>
<script type="text/babel">
// The kit opens on the editor, because it is the surface the design is about. The flow
// Library → New article → Upload → Generating → Editor is all live.
function App() {
  const [screen, setScreen] = React.useState('editor')
  if (screen === 'library') return <Library onNew={() => setScreen('upload')} onOpen={() => setScreen('editor')} />
  if (screen === 'upload') return <UploadScreen onBack={() => setScreen('library')} onBuild={() => setScreen('generating')} />
  if (screen === 'generating') return <Generating onDone={() => setScreen('editor')} />
  return <Editor onBack={() => setScreen('library')} />
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
