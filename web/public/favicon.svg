<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="Quink">
  <!--
    The Quink mark: the wordmark's lightning-bolt "i", alone, on a paper disc.

    NO prefers-color-scheme rule, unlike the "Q" mark this replaced. That one was a bare
    monochrome glyph and had to invert to stay visible on a dark tab strip; this one carries
    its own background, so it reads the same on both. A badge that supplies its own contrast
    is the reason to draw the disc at all.

    Colours are the design system's, not new ones: #2F7D57 is the bolt green (the same
    constant Wordmark.tsx holds) and #F2F2EF is the disc, sampled from Logo/Quink Icon.png.

    The disc path is given its fill EXPLICITLY. The exported source SVG left it off under a
    root `fill="none"`, so it inherited "none" and the disc rendered invisible — a bolt
    floating with no badge, which is not the mark.
  -->
  <path fill="#F2F2EF" d="M1001 539.5C1001 831.383 794.603 1068 540 1068C285.397 1068 79 831.383 79 539.5C79 247.618 285.397 11 540 11C794.603 11 1001 247.618 1001 539.5Z"/>
